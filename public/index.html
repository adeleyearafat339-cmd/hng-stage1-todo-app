<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HNG Stage 1 To-Do App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #333; font-size: 24px; margin-bottom: 20px; text-align: center; }
        .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input, select, textarea { padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #4f46e5; }
        button { background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #4338ca; }
        ul { list-style: none; padding: 0; }
        li { background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #4f46e5; display: flex; justify-content: space-between; align-items: flex-start; }
        .task-info h3 { margin: 0 0 5px 0; font-size: 16px; color: #1f2937; }
        .task-info p { margin: 0 0 5px 0; font-size: 14px; color: #4b5563; }
        .priority-badge { font-size: 11px; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 4px; display: inline-block; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ My Task & Note Manager</h1>
        
        <div class="form-group">
            <input type="text" id="taskTitle" placeholder="What needs to be done?">
            <textarea id="taskNote" placeholder="Add optional notes..." rows="2"></textarea>
            <select id="taskPriority">
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
            </select>
            <button onclick="addTask()">Add Task</button>
        </div>

        <ul id="taskList">
            <!-- Tasks will load here -->
        </ul>
    </div>

    <script>
        const API_URL = ''; // Uses relative URL so it works locally and on Render automatically!

        async function fetchTasks() {
            try {
                const res = await fetch(`${API_URL}/api/tasks`);
                const tasks = await res.json();
                const list = document.getElementById('taskList');
                list.innerHTML = '';
                
                if (tasks.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #9ca3af;">No tasks yet. Add one above!</p>';
                    return;
                }

                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div class="task-info">
                            <h3>${task.title}</h3>
                            ${task.note ? `<p>${task.note}</p>` : ''}
                            <span class="priority-badge">${task.priority} Priority</span>
                        </div>
                        <button class="delete-btn" onclick="deleteTask('${task.id}')">Delete</button>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error('Error fetching tasks:', err);
            }
        }

        async function addTask() {
            const title = document.getElementById('taskTitle').value;
            const note = document.getElementById('taskNote').value;
            const priority = document.getElementById('taskPriority').value;

            if (!title) {
                alert('Please enter a task title!');
                return;
            }

            await fetch(`${API_URL}/api/tasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, note, priority })
            });

            document.getElementById('taskTitle').value = '';
            document.getElementById('taskNote').value = '';
            fetchTasks();
        }

        async function deleteTask(id) {
            await fetch(`${API_URL}/api/tasks/${id}`, { method: 'DELETE' });
            fetchTasks();
        }

        fetchTasks();
    </script>
</body>
</html>
